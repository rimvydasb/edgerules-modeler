<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EdgeRules Modeler</title>
    <link rel="icon" href="assets/marks/EdgeRules.001.png" />
    <link rel="stylesheet" href="app.css?v=5" />
    <style>
      /* ───────── page-level styles ───────── */
      .ell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .clamp {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .lnk {
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13.5px;
      }
      .lnk:hover {
        text-decoration: underline;
      }
      .kind.pm {
        background: var(--subtle);
        color: var(--text);
        border: 1px solid var(--border-strong);
        font: 600 12px var(--sans);
        letter-spacing: 0.02em;
      }
      .kind.sm.pm {
        font-size: 9px;
      }

      .excard .row1 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 22px;
      }
      .split2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }
      .inds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .ind {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
      }
      .ind:hover {
        border-color: var(--border-strong);
      }
      .ind > span:nth-child(2) {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .ind small {
        color: var(--text-3);
        font-size: 12.5px;
      }
      .ind > svg {
        color: var(--text-3);
      }
      .relog {
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
      }
      .rel {
        display: grid;
        grid-template-columns: 96px 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .rel .rprod {
        justify-self: start;
        margin-top: 1px;
      }
      .rel .mono {
        font-size: 12px;
        padding-top: 2px;
      }
      .rel:last-child {
        border-bottom: 0;
      }
      .relhead {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--subtle);
        border-radius: var(--r) var(--r) 0 0;
      }
      .inds4 {
        grid-template-columns: repeat(4, 1fr);
      }
      @media (max-width: 900px) {
        .inds4 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .rprod {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 500;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .rprod::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .rprod.engine {
        background: color-mix(in srgb, var(--k-ruleset) 12%, transparent);
        color: var(--k-ruleset);
      }
      .rtop .mono {
        font-size: 12px;
      }
      .rtitle {
        font-weight: 600;
        font-size: 14px;
      }
      .rtext {
        color: var(--text-2);
        font-size: 13.5px;
      }
      .split2 {
        align-items: start;
      }
      .news a:hover b {
        text-decoration: underline;
      }
      .news b {
        font-weight: 500;
      }
      .news .mono {
        font-size: 12px;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 72px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        font-size: 12.5px;
        color: var(--text-3);
      }
      .foot img {
        width: 22px;
        opacity: 0.55;
        transform-origin: 50% 8%;
      }
      :root[data-theme='dark'] .foot img {
        filter: invert(1);
      }
      .foot a:hover {
        color: var(--text);
      }

      /* examples */
      .exlay {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 32px;
      }
      .facets {
        position: sticky;
        top: calc(var(--bar) + 20px);
        align-self: start;
      }
      .fg {
        margin-bottom: 26px;
        display: flex;
        flex-direction: column;
      }
      .fg .eyebrow {
        margin-bottom: 8px;
      }
      .fg a,
      .fg label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        margin: 0 -8px;
        border-radius: 6px;
        font-size: 13.5px;
        color: var(--text-2);
        cursor: pointer;
      }
      .fg a:hover,
      .fg label:hover {
        background: var(--hover);
        color: var(--text);
      }
      .fg a.on {
        background: var(--subtle);
        color: var(--text);
        font-weight: 500;
      }
      .fg span {
        margin-left: auto;
        font: 12px var(--mono);
        color: var(--text-3);
      }
      .fg input {
        accent-color: var(--primary);
        margin: 0;
      }
      .fg code {
        font-size: 12.5px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .resline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--text-3);
        margin-bottom: 14px;
        min-height: 24px;
      }
      .resline .badge a,
      .resline .badge button {
        display: grid;
        place-items: center;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: var(--text-3);
      }
      .resline .badge svg {
        width: 12px;
        height: 12px;
      }

      /* details */
      .pcrumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-3);
        margin-bottom: 18px;
      }
      .pcrumb a:hover {
        color: var(--text);
      }
      .pcrumb svg {
        width: 14px;
        height: 14px;
      }
      .pcrumb span {
        color: var(--text);
      }
      .dhead {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .dhead h1 {
        font: 600 30px/1.15 var(--sans);
        letter-spacing: -0.025em;
        margin: 0;
      }
      .dhead p {
        margin: 6px 0 0;
        color: var(--text-2);
        font-size: 15px;
      }
      .dact {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .dact .select {
        height: 34px;
      }
      .notice {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: var(--r);
        background: var(--ok-soft);
        color: var(--text);
        font-size: 13.5px;
        margin-bottom: 20px;
      }
      .notice > svg {
        color: var(--ok);
      }
      .notice span {
        flex: 1;
      }
      .notice a {
        text-decoration: underline;
      }
      .dlay {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 20px;
        align-items: start;
      }
      .readme .rh {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        color: var(--text-3);
        font-size: 12.5px;
      }
      .md {
        padding: 8px 28px 24px;
        font-size: 14.5px;
        line-height: 1.65;
      }
      .md h2 {
        font: 600 24px var(--sans);
        letter-spacing: -0.02em;
        margin: 18px 0 8px;
      }
      .md h3 {
        font: 600 17px var(--sans);
        margin: 22px 0 6px;
      }
      .md table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .md th,
      .md td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .md th {
        font-weight: 600;
      }
      .md code {
        background: var(--subtle);
        border: 1px solid var(--border);
        padding: 0 4px;
        border-radius: 4px;
      }
      .dside {
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: sticky;
        top: calc(var(--bar) + 20px);
      }
      .kv {
        display: grid;
        grid-template-columns: 90px 1fr;
        margin: 0;
        font-size: 13.5px;
      }
      .kv dt {
        color: var(--text-3);
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
      }
      .kv dd {
        margin: 0;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
      }
      .kv dt:nth-last-child(2),
      .kv dd:last-child {
        border-bottom: 0;
      }
      .warnc {
        background: var(--warn-soft);
        border-color: transparent;
      }

      /* workspace */
      .storage-f {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        background: var(--surface);
        font-size: 12.5px;
        color: var(--text-2);
        cursor: pointer;
        text-align: left;
      }
      .storage-f:hover {
        border-color: var(--border-strong);
      }
      .storage-f .sf-top {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font: inherit;
        color: inherit;
      }
      .storage-f .sf-top span {
        margin: 0;
        font-size: 12px;
      }
      .storage-f .meter {
        width: 100%;
      }
      .fg .storage-f span {
        margin-left: 0;
      }
      .excard .cf {
        white-space: nowrap;
      }
      .excard .cf .saved {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .excard .cf .saved svg {
        width: 13px;
        height: 13px;
      }
      .excard .cf .iconbtn.sm {
        width: 26px;
        height: 26px;
        margin: -4px -6px -4px 0;
      }
      .excard .cf .hov {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .excard .cf .hov svg {
        width: 13px;
        height: 13px;
      }
      .storage {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        background: var(--surface);
        font-size: 12.5px;
        color: var(--text-2);
        cursor: pointer;
      }
      .storage:hover {
        border-color: var(--border-strong);
      }
      .meter {
        width: 60px;
        height: 4px;
        border-radius: 2px;
        background: var(--subtle);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .meter i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--text-2);
        min-width: 2px;
      }

      /* app bar: section links + the open project tab (same bar on every page) */
      .nav a svg {
        width: 15px;
        height: 15px;
        color: var(--text-3);
      }
      .nav a.on svg {
        color: var(--text);
      }
      .nsep {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 6px;
        align-self: center;
      }
      .ptab {
        display: flex;
        align-items: center;
        border-radius: var(--r-sm);
        max-width: 260px;
      }
      .ptab a {
        padding: 6px 4px 6px 8px !important;
        min-width: 0;
      }
      .ptab .lbl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ptab button {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        margin-right: 4px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--text-3);
        cursor: pointer;
      }
      .ptab button svg {
        width: 13px;
        height: 13px;
      }
      .ptab button:hover {
        background: var(--border);
        color: var(--text);
      }
      .ptab:hover {
        background: var(--hover);
      }
      .ptab.on {
        background: var(--subtle);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .ptab.on a {
        color: var(--text);
        background: none !important;
      }
      .kind.xs {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        font-size: 8.5px !important;
      }

      /* project shell: Shell header row + explorer + editor */
      body[data-page='project'] {
        overflow: hidden;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: calc(100vh - var(--bar));
        --sh-border: var(--fe-border);
        --sh-muted: var(--fe-muted);
      }
      .shell-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      /* The Shell header row (src/components/shell/shell.module.css): one 40px step, step cells, sharp lines. */
      .sh-row {
        display: flex;
        flex: none;
        align-items: stretch;
        height: 41px;
        border-bottom: 1px solid var(--sh-border);
        background: var(--sh-muted);
        font-size: 14px;
      }
      .sh-kind {
        display: grid;
        place-items: center;
        width: 40px;
        flex: none;
        border-right: 1px solid var(--sh-border);
        background: var(--k-model);
        color: #fff;
      }
      .sh-crumbs {
        display: flex;
        flex: 1;
        min-width: 0;
        align-items: center;
        gap: 4px;
        padding-inline: 8px;
        white-space: nowrap;
        overflow: hidden;
      }
      .sh-crumb {
        padding: 2px 4px;
        border-radius: 4px;
        color: var(--fe-dimmed);
      }
      .sh-crumb:hover {
        background: var(--sh-border);
        color: var(--text);
      }
      .sh-sep {
        width: 14px !important;
        height: 14px !important;
        color: var(--fe-dimmed);
      }
      .sh-cur {
        padding-inline: 4px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sh-proj {
        display: flex;
        align-items: center;
        gap: 4px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .sh-proj {
        padding: 2px 4px 2px 6px;
        border-radius: 4px;
        color: var(--fe-dimmed);
        font-weight: 400;
      }
      .sh-proj.cur {
        color: var(--text);
        font-weight: 600;
      }
      .sh-proj:hover {
        background: var(--sh-border);
        color: var(--text);
      }

      /* settings dialog — shell.module.css .settings*: glass sheet, sharp 1px ruled rows */
      .st-scrim {
        background: rgb(0 0 0 / 0.12);
        align-items: center;
        padding-top: 0;
      }
      .st-dialog {
        width: 620px;
        max-width: calc(100vw - 32px);
        overflow: hidden;
        border: 1px solid var(--fe-border);
        background: color-mix(in srgb, var(--fe-body) 66%, transparent);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.05),
          0 12px 32px rgb(0 0 0 / 0.14);
        font: 14px/1.55 var(--fe-ui);
        color: var(--fe-text);
      }
      .st-head {
        display: flex;
        align-items: stretch;
        height: 40px;
        border-bottom: 1px solid var(--fe-border);
        background: color-mix(in srgb, var(--fe-muted) 70%, transparent);
      }
      .st-head b {
        flex: 1;
        display: flex;
        align-items: center;
        padding-inline: 10px;
        font-weight: 600;
      }
      .st-tile {
        display: grid;
        place-items: center;
        width: 40px;
        border-right: 1px solid var(--fe-border);
        background: #17191c;
        color: #fff;
      }
      .st-x {
        width: 40px;
        border: 0;
        border-left: 1px solid var(--fe-border);
        background: none;
        color: var(--fe-dimmed);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .st-x:hover {
        background: var(--fe-border);
        color: var(--fe-text);
      }
      .st-field {
        display: grid;
        grid-template-columns: 120px 1fr;
        border-bottom: 1px solid var(--fe-border);
      }
      .st-field label {
        padding: 10px;
        font-weight: 600;
        line-height: 20px;
      }
      .st-cell {
        border-left: 1px solid var(--fe-border);
      }
      .st-cell input,
      .st-cell textarea {
        display: block;
        width: 100%;
        min-height: 40px;
        padding: 9px 10px;
        border: 0;
        background: var(--fe-body);
        color: var(--fe-text);
        font: inherit;
        line-height: 20px;
        resize: vertical;
      }
      .st-cell input:focus,
      .st-cell textarea:focus {
        outline: 2px solid var(--fe-primary);
        outline-offset: -2px;
      }
      .st-hint {
        grid-column: 1 / -1;
        padding: 6px 10px;
        border-top: 1px solid var(--fe-border);
        background: color-mix(in srgb, var(--fe-muted) 70%, transparent);
        color: var(--fe-dimmed);
        font-size: 12px;
        line-height: 1.4;
      }
      .st-actions {
        display: flex;
        justify-content: flex-end;
        height: 40px;
        background: color-mix(in srgb, var(--fe-muted) 70%, transparent);
      }
      .st-actions button {
        width: 120px;
        border: 0;
        border-left: 1px solid var(--fe-border);
        background: none;
        color: var(--fe-text);
        font: inherit;
        cursor: pointer;
      }
      .st-actions button:hover {
        background: var(--fe-border);
      }
      .st-actions .save {
        background: var(--fe-body);
        color: var(--fe-primary);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--fe-primary);
      }
      .sh-proj svg {
        width: 14px;
        height: 14px;
      }
      .sh-views {
        display: flex;
      }
      .sh-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 120px;
        padding: 0;
        border: 0;
        border-left: 1px solid var(--sh-border);
        background: var(--sh-muted);
        color: var(--fe-dimmed);
        cursor: pointer;
      }
      .sh-cell.sq {
        width: 40px;
      }
      .sh-cell:hover {
        background: var(--sh-border);
      }
      .sh-cell.on {
        background: var(--fe-body);
        color: var(--text);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--fe-primary);
      }

      .explorer {
        width: 256px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--surface);
        font-size: 13px;
      }
      .ex-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        flex: none;
        padding: 0 4px 0 14px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .ex-body {
        flex: 1;
        overflow: auto;
        padding: 10px 8px 24px;
      }
      .ex-toggle {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--text-2);
        cursor: pointer;
      }
      .ex-toggle:hover {
        background: var(--hover);
      }
      .explorer.closed {
        width: 41px;
        align-items: center;
        padding-top: 4px;
      }
      .explorer .input.sm {
        height: 32px;
        margin-bottom: 8px;
      }
      .explorer .input.sm input {
        font-size: 13px;
      }
      .explorer details {
        margin-top: 8px;
      }
      .explorer summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        font: 500 10.5px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-3);
        cursor: pointer;
      }
      .explorer summary::-webkit-details-marker {
        display: none;
      }
      .explorer summary .c {
        margin-left: auto;
      }
      .ei {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }
      .ei .mono {
        font-size: 12.5px;
      }
      .ei:hover {
        background: var(--hover);
      }
      .ei.on {
        background: var(--subtle);
        box-shadow: inset 2px 0 0 var(--text);
        font-weight: 500;
      }
      .ei.top {
        padding: 6px 8px;
      }
      .ei.top > svg {
        width: 20px;
        color: var(--text-2);
      }
      .stage {
        flex: 1;
        overflow: auto;
        position: relative;
        background: var(--bg);
      }
      .stage.dots {
        background-color: var(--fe-canvas);
        background-image: radial-gradient(circle, var(--fe-dot) 0.6px, transparent 0.7px);
        background-size: 20px 20px;
      }
      .phome {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 32px 80px;
      }
      .phead {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 22px;
      }
      .phead h1 {
        font: 600 32px/1.1 var(--sans);
        letter-spacing: -0.03em;
        margin: 8px 0 10px;
      }
      .pmeta {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12.5px;
      }
      .pmeta .tag svg {
        width: 12px;
        height: 12px;
      }
      .pgrid {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 24px;
        align-items: start;
      }
      .readme-ex p {
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--text-2);
      }
      .svcs {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: var(--r);
        background: var(--surface);
        overflow: hidden;
      }
      .svc {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .svc:hover {
        background: var(--bg);
      }
      .svc > svg {
        color: var(--text-3);
      }
      .svc .sig {
        font: 13.5px var(--mono);
        margin-bottom: 2px;
      }
      .svc .sig b {
        font-weight: 500;
      }
      .svc .sig span {
        color: var(--k-type);
      }
      .svc.add {
        border: 0;
        background: none;
        color: var(--text-3);
        font-size: 13px;
        cursor: pointer;
        padding: 10px 16px;
        gap: 8px;
      }
      .svc.add:hover {
        color: var(--text);
      }
      .wlinks {
        display: flex;
        gap: 10px;
        color: var(--text-2);
      }
      .wlinks span {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .newc {
        border-style: dashed;
        background: transparent;
        align-items: center;
        justify-content: center;
        flex-direction: row;
        gap: 8px;
        min-height: 130px;
        color: var(--text-3);
        cursor: pointer;
        font-size: 13.5px;
      }
      .newc:hover {
        color: var(--text);
        border-color: var(--text-3);
      }
      .pside {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pside .cb {
        gap: 6px;
      }
      .cnt-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
        font-size: 13.5px;
        cursor: pointer;
      }
      .cnt-row b {
        margin-left: auto;
        font: 500 13px var(--mono);
      }
      .cnt-row:hover span {
        text-decoration: underline;
      }
      .pside .big {
        font-size: 13.5px;
        color: var(--text-2);
        margin-bottom: 6px;
      }
      .pside .big b {
        font: 600 22px var(--sans);
        color: var(--text);
        letter-spacing: -0.02em;
      }
      .pside .btn {
        align-self: flex-start;
      }

      /* editor mocks */
      .note-chip {
        position: absolute;
        top: 12px;
        left: 12px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-3);
        z-index: 2;
      }
      /* ───────── Flow Editor mock — values of flowEditor.module.css + coreNode.module.css (Mantine light/dark) ───────── */
      :root {
        --fe-body: #fff;
        --fe-text: #000;
        --fe-border: #ced4da; /* --mantine-color-default-border */
        --fe-muted: #f8f9fa; /* --mantine-color-default-hover */
        --fe-dimmed: #868e96;
        --fe-canvas: #f8f9fa;
        --fe-dot: #ced4da;
        --fe-primary: #228be6;
        --fe-t-number: #1c7ed6;
        --fe-t-string: #2f9e44;
        --fe-t-record: #495057;
        --fe-wire: #adb5bd;
        --fe-out: #2f9e44;
        --fe-k-input: #ed6c02;
        --fe-k-fn: #1976d2;
        --fe-k-expr: #7048e8;
        --fe-k-out: #2f9e44;
        --fe-desc: color-mix(in srgb, #fab005 6%, #fff);
        --fe-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --fe-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      :root[data-theme='dark'] {
        --fe-body: #242424;
        --fe-text: #c9c9c9;
        --fe-border: #424242;
        --fe-muted: #3b3b3b;
        --fe-dimmed: #828282;
        --fe-canvas: #1f1f1f;
        --fe-dot: #3a3a3a;
        --fe-t-number: #4dabf7;
        --fe-t-string: #69db7c;
        --fe-t-record: #adb5bd;
        --fe-wire: #b8b8b8;
        --fe-out: #69db7c;
        --fe-desc: color-mix(in srgb, #fab005 6%, #242424);
      }
      .fe {
        position: absolute;
        inset: 0;
        display: flex;
        background: var(--fe-body);
        color: var(--fe-text);
        font: 14px/1.55 var(--fe-ui);
        overflow: hidden;
      }
      .fe *,
      .fe *::before,
      .fe *::after {
        box-sizing: border-box;
      }
      .fe-rail {
        flex: 0 0 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding-top: 6px;
        border-right: 1px solid var(--fe-border);
        background: var(--fe-body);
      }
      .fe-railbtn {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--fe-text);
      }
      .fe-railitem {
        display: flex;
        padding: 3px;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: grab;
      }
      .fe-railitem:hover {
        border-color: var(--fe-border);
        background: var(--fe-muted);
      }
      .fe-rt {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 4px;
        color: #fff;
      }
      .fe-rt svg {
        width: 17px;
        height: 17px;
      }
      .fe-canvas {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        background-color: var(--fe-canvas);
        background-image: radial-gradient(circle, var(--fe-dot) 0.6px, transparent 0.7px);
        background-size: 20px 20px;
      }
      .fe-world {
        position: absolute;
        left: 120px;
        top: 20px;
        width: 1300px;
        height: 720px;
      }
      .fe-wires {
        position: absolute;
        inset: 0;
        overflow: visible;
        fill: none;
        stroke-width: 1.75;
        pointer-events: none;
      }
      .fe-wires .num {
        stroke: var(--fe-t-number);
      }
      .fe-wires .rec {
        stroke: var(--fe-wire);
      }
      .fe-node {
        position: absolute;
        border: 1px solid var(--fe-border);
        border-bottom: 0;
        background: var(--fe-body);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.05),
          0 4px 14px rgb(0 0 0 / 0.06);
        box-sizing: content-box !important;
      }
      .fe-row {
        position: relative;
        display: flex;
        height: 40px;
        border-bottom: 1px solid var(--fe-border);
      }
      .fe-tile {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        border-right: 1px solid var(--fe-border);
        color: #fff;
      }
      .fe-hs {
        display: flex;
        flex: 1;
        min-width: 0;
      }
      .fe-hl {
        display: flex;
        flex: 1;
        align-items: center;
        min-width: 0;
      }
      .fe-hfirst {
        background: var(--fe-muted);
      }
      .fe-title {
        display: flex;
        flex: 1;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
        padding-inline: 10px;
        overflow: hidden;
        white-space: nowrap;
      }
      .fe-title b {
        font-weight: 600;
      }
      .fe-path,
      .fe-sum {
        color: var(--fe-dimmed);
        font: 12px var(--fe-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fe-kebab {
        display: grid;
        place-items: center;
        flex: 0 0 40px;
        align-self: stretch;
        border-left: 1px solid var(--fe-border);
        background: var(--fe-muted);
        color: var(--fe-dimmed);
      }
      .fe-sumrow {
        align-items: center;
        gap: 10px;
      }
      .fe-sumrow .fe-sum {
        margin-left: auto;
        padding-right: 18px;
      }
      .fe-lbl,
      .fe-band {
        color: var(--fe-dimmed);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .fe-lbl {
        padding-left: 10px;
      }
      .fe-pick {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 6px;
        border: 1px solid var(--fe-border);
        border-radius: 4px;
        font: 13px var(--fe-mono);
        white-space: nowrap;
      }
      .fe-pick > svg {
        width: 13px;
        height: 13px;
        color: var(--fe-dimmed);
      }
      .fe-mini {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 3px;
        color: #fff;
      }
      .fe-mini svg {
        width: 13px;
        height: 13px;
      }
      .fe-ext {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 1px solid var(--fe-border);
        border-radius: 4px;
        color: var(--fe-dimmed);
        margin-left: -4px;
      }
      .fe-ext svg {
        width: 12px;
        height: 12px;
      }
      .fe-desc {
        align-items: center;
        padding-inline: 10px;
        background: var(--fe-desc);
        color: var(--fe-dimmed);
        font-size: 12.5px;
        font-style: italic;
        line-height: 16px;
      }
      .fe-desc span {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .fe-track {
        position: relative;
        display: flex;
        align-items: center;
        flex-shrink: 0;
        min-width: 0;
        padding-inline: 10px;
      }
      .fe-track + .fe-track {
        border-left: 1px solid var(--fe-border);
      }
      .fe-row > .fe-track:last-of-type {
        flex: 1;
      }
      .fe-band {
        background: var(--fe-muted);
      }
      .fe-band-out {
        background: color-mix(in srgb, #40c057 8%, transparent);
        color: var(--fe-out);
      }
      .fe-name {
        padding-right: 30px;
      }
      .fe-outname {
        justify-content: flex-end;
        color: var(--fe-dimmed);
        padding-right: 10px;
      }
      .fe-req {
        color: #fa5252;
        margin-left: 2px;
      }
      .fe-rk {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 28px;
        display: grid;
        place-items: center;
        color: var(--fe-dimmed);
      }
      .fe-rk svg,
      .fe-kebab svg {
        width: 15px;
        height: 15px;
      }
      .fe-val {
        font: 13px var(--fe-mono);
        color: var(--fe-t-string);
      }
      .fe-filler {
        background: repeating-linear-gradient(135deg, transparent 0 6px, var(--fe-muted) 6px 7px);
      }
      .fe-tint {
        background: color-mix(in srgb, #40c057 8%, transparent);
        color: var(--fe-dimmed);
        font-size: 13px;
      }
      .fe-pin {
        position: absolute;
        top: 50%;
        z-index: 3;
        width: 12px;
        height: 12px;
        margin-top: -6px;
        border: 2px solid var(--pc);
        border-radius: 50%;
        background: var(--fe-body);
      }
      .fe-pin.in {
        left: -7px;
      }
      .fe-pin.out {
        right: -7px;
      }
      .fe-pin.num {
        --pc: var(--fe-t-number);
      }
      .fe-pin.rec {
        --pc: var(--fe-t-record);
        border-radius: 2px;
      }
      .fe-pin.on {
        background: var(--pc);
      }
      .fe-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .fe-table th,
      .fe-table td {
        height: 40px;
        padding: 0 10px;
        border-bottom: 1px solid var(--fe-border);
        white-space: nowrap;
      }
      .fe-table th {
        background: var(--fe-muted);
        color: var(--fe-dimmed);
        font-weight: 400;
        text-align: left;
      }
      .fe-table td {
        text-align: right;
        font-family: var(--fe-mono);
        color: var(--fe-t-number);
      }
      .fe-table th:first-child,
      .fe-table td:first-child {
        width: 36px;
        text-align: left;
        background: var(--fe-muted);
        color: var(--fe-dimmed);
        border-right: 1px solid var(--fe-border);
        font-family: var(--fe-ui);
      }
      .fe-chartbox {
        position: relative;
        border-bottom: 1px solid var(--fe-border);
        padding: 4px 0 2px;
      }
      .fe-chart {
        display: block;
        font: 10px var(--fe-ui);
      }
      .fe-chart text {
        fill: var(--fe-dimmed);
      }
      .fe-chart text.t {
        fill: var(--fe-text);
        font-weight: 600;
      }
      .fe-chart rect {
        fill: #fd7e14;
      }
      .fe-chart .g {
        stroke: var(--fe-muted);
      }
      .fe-chart .ax {
        stroke: var(--fe-border);
      }
      .fe-resize {
        position: absolute;
        right: 3px;
        bottom: 3px;
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--fe-dimmed);
        border-bottom: 1.5px solid var(--fe-dimmed);
        opacity: 0.6;
      }
      .fe-controls {
        position: absolute;
        left: 15px;
        bottom: 15px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--fe-border);
        border-radius: 4px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        z-index: 5;
      }
      .fe-controls button {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-bottom: 1px solid var(--fe-border);
        background: var(--fe-body);
        color: var(--fe-text);
        cursor: pointer;
      }
      .fe-controls button:last-child {
        border-bottom: 0;
      }
      .fe-controls button:hover {
        background: var(--fe-muted);
      }
      .fe-controls svg {
        width: 13px;
        height: 13px;
      }
      .fe-minimap {
        position: absolute;
        right: 15px;
        bottom: 15px;
        border: 1px solid var(--fe-border);
        border-radius: 4px;
        background: var(--fe-body);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        z-index: 5;
      }
      .fe-minimap .vp {
        fill: var(--fe-body);
        stroke: none;
      }
      :root .fe-minimap {
        background: color-mix(in srgb, var(--fe-text) 5%, var(--fe-body));
      }
      .boxed {
        font-size: 13px;
      }
      .bx-h,
      .bx-g {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--subtle);
      }
      .bx-r {
        display: grid;
        grid-template-columns: 220px 1fr;
        padding: 6px 12px 6px 44px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .codev {
        margin: 0;
        padding: 28px;
        font: 13px/1.7 var(--mono);
        color: var(--text);
      }
      .codev .kw {
        color: var(--k-ruleset);
      }
      .codev .cm {
        color: var(--text-3);
      }

      .opening {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 13.5px;
        color: var(--text-2);
        animation: fade 0.15s;
      }
      .opening img {
        width: 52px;
        transform-origin: 50% 8%;
        animation: sway 1.6s ease-in-out infinite;
        opacity: 0.85;
      }
      :root[data-theme='dark'] .opening img {
        filter: invert(1);
      }

      /* design notes */
      .notesgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .notesgrid .cb {
        gap: 12px;
      }
      .sws {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .sw {
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .sw span {
        height: 36px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .sw code {
        color: var(--text-3);
        font-size: 10.5px;
      }
      .exopt {
        border: 1px solid var(--border) !important;
        border-radius: 8px !important;
        padding: 10px 12px !important;
        margin-bottom: 6px;
        display: flex !important;
        width: 100%;
        background: var(--surface) !important;
        cursor: pointer;
        font-size: 13.5px;
      }
      .exopt:hover {
        border-color: var(--text-3) !important;
      }

      @media (max-width: 960px) {
        .exlay,
        .dlay,
        .pgrid,
        .split2,
        .notesgrid {
          grid-template-columns: 1fr;
        }
        .facets,
        .dside {
          position: static;
        }
        .explorer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
